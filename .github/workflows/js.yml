name: CI

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies (root)
        run: npm install

      - name: Install frontend dependencies
        run: |
          cd accountflow-front
          npm ci

      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Create commitlint config
        run: |
          echo "extends: ['@commitlint/config-conventional']" > .commitlintrc.yaml

      - name: Validate PR Commits with commitlint
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Validate Push Commits with commitlint
        if: github.event_name == 'push'
        run: |
          npx commitlint --from ${{ github.event.before }} --to ${{ github.event.after }} --verbose

      - name: Create .prettierignore
        run: |
          echo 'node_modules\nbuild\ndist\nvenv\n.next\n' > .prettierignore

      - name: Run Prettier and show formatting diffs
        run: |
          npx prettier '**/*.{css,scss,yaml,yml,ts,js,jsx,tsx,json,md}' --write
          git diff --color --exit-code
