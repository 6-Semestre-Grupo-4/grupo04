name: CD

on:
    workflow_run:
        workflows: ["CI"]
        branches: [main, dev]
        types: [completed]

jobs:
    deploy:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            packages: read

        steps:
            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1.2.2
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ubuntu
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      set -e
                      BRANCH="${{ github.event.workflow_run.head_branch }}"

                      echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

                      if [ "$BRANCH" = "main" ]; then
                        TAG="prod"
                      else
                        TAG="dev"
                      fi

                      BACK_IMAGE="ghcr.io/${{ github.repository_owner }}/backend:$TAG"
                      FRONT_IMAGE="ghcr.io/${{ github.repository_owner }}/frontend:$TAG"

                      docker pull "$BACK_IMAGE"
                      docker pull "$FRONT_IMAGE"

                      sed -i "s|build:|image: $BACK_IMAGE|g; s|context:.*||g; s|dockerfile:.*||g" docker-compose.yml
                      sed -i "/frontend:/,/^  [a-z]/ { s|build:|image: $FRONT_IMAGE|g; s|context:.*||g; s|dockerfile:.*||g }" docker-compose.yml

                      sed -i '/volumes:/,/^  [a-z]/d' docker-compose.yml

                      docker-compose down || true
                      docker-compose up -d

                      docker image prune -af
