name: CD

on:
  workflow_run:
    workflows: ['CI']
    branches: [main, dev]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: EC2_HOST
    permissions:
      contents: read
      actions: read
      packages: read

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            if [ "$BRANCH" = "main" ]; then
              TAG="prod"
            else
              TAG="dev"
            fi

            BACK_IMAGE="ghcr.io/$REPO_OWNER/backend:$TAG"
            FRONT_IMAGE="ghcr.io/$REPO_OWNER/frontend:$TAG"

            # Pull das imagens
            docker pull "$BACK_IMAGE"
            docker pull "$FRONT_IMAGE"

            cat > docker-compose.yml <<EOF
            services:
              frontend:
                image: $FRONT_IMAGE
                ports:
                  - '3000:3000'
                restart: unless-stopped
                environment:
                  - NEXT_TELEMETRY_DISABLED=1

              backend:
                image: $BACK_IMAGE
                ports:
                  - '8000:8000'
                restart: unless-stopped
                environment:
                  - DJANGO_SETTINGS_MODULE=config.settings.django
                  - PYTHONUNBUFFERED=1
                  - PYTHONDONTWRITEBYTECODE=1
                  - TZ=America/Sao_Paulo
            EOF

            docker compose down -v || true
            docker compose up -d --build

            sleep 5

            if ! docker ps | grep -q "frontend\|backend"; then
              echo "Erro: Containers não estão rodando"
              docker-compose logs
              exit 1
            fi

            rm -f docker-compose.yml

            docker image prune -af
